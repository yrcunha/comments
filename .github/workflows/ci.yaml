name: CI Pipeline

on: pull_request

jobs:
  commit:
    name: Checkout Commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'
      - name: NPM CI
        run: npm ci
      - name: Commitlint
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    name: Checkout Lint
    runs-on: ubuntu-latest
    needs:
      - commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'
      - name: NPM CI
        run: npm ci
      - name: Prettier
        run: npm run lint:prettier:check
      - name: Eslint
        run: npm run lint:eslint:check

  audit:
    name: Audit
    runs-on: ubuntu-latest
    needs:
      - commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical

  test:
    name: Test
    runs-on: ubuntu-latest
    environment: test
    needs:
      - lint
      - Audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm test
